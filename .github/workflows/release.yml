name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable numeric tag (e.g. 1.2.4)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag }}
jobs:
  prepare:
    if: github.repository == 'berry-shake/komari'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: mod
          fetch-depth: 0
      - id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py prepare "$TAG" berry-shake/komari
  frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: ./.github/actions/build-frontend
        with:
          artifact-name: komari-frontend
  test:
    needs: [prepare, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: ./.github/actions/restore-frontend
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: go test -short ./...
      - run: go test -race ./pkg/ddns ./web/api/admin
  binaries:
    needs: [prepare, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, target: x86_64-linux-musl, suffix: ''}
          - {goos: linux, goarch: arm64, target: aarch64-linux-musl, suffix: ''}
          - {goos: linux, goarch: '386', target: x86-linux-musl, suffix: ''}
          - {goos: linux, goarch: riscv64, target: riscv64-linux-musl, suffix: ''}
          - {goos: linux, goarch: loong64, target: loongarch64-linux-musl, suffix: ''}
          - {goos: windows, goarch: amd64, target: x86_64-windows-gnu, suffix: .exe}
          - {goos: windows, goarch: arm64, target: aarch64-windows-gnu, suffix: .exe}
          - {goos: windows, goarch: '386', target: x86-windows-gnu, suffix: .exe}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: ./.github/actions/restore-frontend
      - uses: ./.github/actions/setup-zig
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          CC: zig cc -target ${{ matrix.target }}
          VERSION_HASH: ${{ needs.prepare.outputs.sha }}
          BINARY: komari-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
        run: go build -trimpath -ldflags="-s -w -X github.com/komari-monitor/komari/utils.CurrentVersion=$TAG -X github.com/komari-monitor/komari/utils.VersionHash=$VERSION_HASH" -o "build/$BINARY" .
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/*
          if-no-files-found: error
  publish:
    needs: [prepare, binaries, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: build
          merge-multiple: true
      - run: python3 scripts/release.py checksums build
      - run: cp build/komari-linux-amd64 build/komari-linux-arm64 .
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/berry-shake/komari:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/berry-shake/komari
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}
          provenance: false
      - name: Verify tag still identifies the built commit
        run: |
          git fetch --depth=1 origin "refs/tags/$TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$(git rev-parse HEAD)"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$TAG" build/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --generate-notes
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
      - name: Promote image latest
        run: docker buildx imagetools create --tag ghcr.io/berry-shake/komari:latest "ghcr.io/berry-shake/komari:$TAG"
